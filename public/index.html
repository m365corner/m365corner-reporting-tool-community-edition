<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M365 Reporting Tool – Community Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 8px rgba(0,0,0,0.05);
            /* Sticky behavior */
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

            .sidebar h5 {
                margin-bottom: 10px;
                font-weight: 600;
                text-align: center;
            }

        .sidebar-search {
            margin-bottom: 12px;
        }

        details {
            margin-bottom: 10px;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            padding: 8px;
            background: #e9ecef;
            border-radius: 6px;
            list-style: none;
        }

            summary::-webkit-details-marker {
                display: none;
            }

        details[open] summary {
            background: #dee2e6;
        }

        .menu-group {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .menu-group button {
                text-align: left;
            }

        /* Active report highlight */
        .active-report {
            background-color: #0d6efd !important;
            color: #fff !important;
            border-color: #0d6efd !important;
        }

        /* RIGHT CONTENT */
        .content {
            flex: 1;
            min-width: 0;
        }

        /* TOP CENTERED ACTIONS */
        .top-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 992px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                position: relative;
                max-height: none;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid py-4">

        <!-- CENTERED HEADER + ACTIONS -->
        <div class="text-center mb-4">
            <h1 class="mb-3">M365 Reporting Tool – Community Edition</h1>
            <p>Note: DB Syncs should be run once in every 7 days</p><br />

            <div class="top-actions">
                <button id="loginBtn" class="btn btn-primary">Login with Microsoft</button>
                <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
                <button id="syncBtn" class="btn btn-success">Sync Users</button>
                <button id="syncBtnGroups" class="btn btn-success">Sync Groups</button>
                <button id="syncBtnTeams" class="btn btn-success">Sync Teams</button>
            </div>

            <div id="statusMessage" class="text-muted"></div>
        </div>

        <div class="layout">

            <!-- LEFT REPORT MENU -->
            <aside class="sidebar">
                <h5>Reports</h5>

                <!-- Search -->
                <input type="text"
                       id="reportSearch"
                       class="form-control sidebar-search"
                       placeholder="Search reports..." />

                <!-- USERS -->
                <details open>
                    <summary>Users</summary>
                    <div class="menu-group">
                        <button id="allUsersBtn" class="btn btn-outline-dark">All Users</button>
                        <button id="enabledUsersBtn" class="btn btn-outline-dark">Enabled Users</button>
                        <button id="disabledUsersBtn" class="btn btn-outline-dark">Disabled Users</button>
                        <button id="licensedUsersBtn" class="btn btn-outline-dark">Licensed Users</button>
                        <button id="unlicensedUsersBtn" class="btn btn-outline-dark">Unlicensed Users</button>
                    </div>
                </details>

                <!-- GROUPS -->
                <details>
                    <summary>Groups</summary>
                    <div class="menu-group">
                        <button id="allGroupsBtn" class="btn btn-outline-dark">All Groups</button>
                        <button id="unifiedGroupsBtn" class="btn btn-outline-dark">Unified Groups</button>
                        <button id="distributionGroupsBtn" class="btn btn-outline-dark">Distribution Groups</button>
                        <button id="securityGroupsBtn" class="btn btn-outline-dark">Security Groups</button>
                        <button id="mailEnabledSecurityGroupsBtn" class="btn btn-outline-dark">Mail-enabled Security Groups</button>
                        <button id="emptyGroupsBtn" class="btn btn-outline-dark">Empty Groups</button>
                        <button id="recentlyCreatedGroupsBtn" class="btn btn-outline-dark">Recently Created Groups</button>
                        <button id="groupMembersBtn" class="btn btn-outline-dark">Group Members</button>
                        <button id="btn-groups-owners" class="btn btn-outline-dark">Group Owners</button>
                        <button id="disabled-user-groups" class="btn btn-outline-dark">Groups With Disabled Users</button>
                    </div>
                </details>

                <!-- TEAMS -->
                <details>
                    <summary>Teams</summary>
                    <div class="menu-group">
                        <button id="allTeamsBtn" class="btn btn-outline-dark">All Teams</button>
                        <button id="publicTeamsBtn" class="btn btn-outline-dark">Public Teams</button>
                        <button id="privateTeamsBtn" class="btn btn-outline-dark">Private Teams</button>
                        <button id="hiddenTeamsBtn" class="btn btn-outline-dark">Hidden Membership Teams</button>
                        <button id="archivedTeamsBtn" class="btn btn-outline-dark">Archived Teams</button>
                        <button id="nodescTeamsBtn" class="btn btn-outline-dark">Teams Without Description</button>
                        <button id="teamsPvtChannels" class="btn btn-outline-dark">Teams With Private Channels</button>
                        <button id="teamsSharedChannels" class="btn btn-outline-dark">Teams With Shared Channels</button>
                        <button id="recentTeamsBtn" class="btn btn-outline-dark">Recently Created Teams</button>
                        <button id="teamOwnersBtn" class="btn btn-outline-dark">Team Owners</button>
                    </div>
                </details>
            </aside>

            <!-- RIGHT REPORT CONTENT -->
            <main class="content">
                <h2 id="reportName"></h2>
                <span id="sfields"></span>
                <div id="reportContent" class="mt-4"></div>
            </main>

        </div>

    </div>

    <!-- EXISTING LOGIC -->
    <script src="./scripts/main.js"></script>

    <!-- NEW UI ENHANCEMENTS -->
    <script>
        /* ===========================
           Sidebar Search
        =========================== */
        document.getElementById("reportSearch").addEventListener("input", function () {
            const term = this.value.toLowerCase();
            const allButtons = document.querySelectorAll(".menu-group button");
            const allDetails = document.querySelectorAll("aside.sidebar details");

            allDetails.forEach(d => d.open = false);

            allButtons.forEach(btn => {
                const match = btn.textContent.toLowerCase().includes(term);
                btn.style.display = match ? "block" : "none";
                if (match) {
                    btn.closest("details").open = true;
                }
            });

            if (!term) {
                allButtons.forEach(btn => btn.style.display = "block");
                document.querySelector("aside.sidebar details").open = true;
            }
        });

        /* ===========================
           Active Report Highlight
        =========================== */
        function setActiveReport(route) {
            document
                .querySelectorAll(".menu-group button")
                .forEach(btn => btn.classList.remove("active-report"));

            const map = {
                "all": "allUsersBtn",
                "enabled": "enabledUsersBtn",
                "disabled": "disabledUsersBtn",
                "licensed": "licensedUsersBtn",
                "unlicensed": "unlicensedUsersBtn",

                "groups/all": "allGroupsBtn",
                "groups/unified": "unifiedGroupsBtn",
                "groups/distribution": "distributionGroupsBtn",
                "groups/security-enabled": "securityGroupsBtn",
                "groups/mail-enabled-security": "mailEnabledSecurityGroupsBtn",
                "groups/empty": "emptyGroupsBtn",
                "groups/recently-created": "recentlyCreatedGroupsBtn",
                "groups/members": "groupMembersBtn",
                "groups/owners": "btn-groups-owners",
                "groups/disabled-members": "disabled-user-groups",

                "teams/all": "allTeamsBtn",
                "teams/public": "publicTeamsBtn",
                "teams/private": "privateTeamsBtn",
                "teams/hidden-memberships": "hiddenTeamsBtn",
                "teams/archived": "archivedTeamsBtn",
                "teams/teams-without-description": "nodescTeamsBtn",
                "teams/teams-private-channels": "teamsPvtChannels",
                "teams/teams-shared-channels": "teamsSharedChannels",
                "teams/recently-created-teams": "recentTeamsBtn",
                "teams/teams-owners": "teamOwnersBtn"
            };

            const btnId = map[route];
            if (btnId) {
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.add("active-report");
            }
        }

        /* Hook into existing fetchReport */
        const _fetchReport = window.fetchReport;
        window.fetchReport = function (route, page = 1) {
            setActiveReport(route);
            return _fetchReport(route, page);
        };
    </script>

</body>
</html>
